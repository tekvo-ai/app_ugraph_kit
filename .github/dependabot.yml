version: 2
updates:
  # yt-dlp is a hard *runtime* dependency on a fast release cadence, and every dep
  # carries a lower bound only — without this, an upstream break lands silently.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
