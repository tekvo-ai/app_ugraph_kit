name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    name: Publish ugraph-kit to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ugraph-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
