[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugraph-kit"
version = "0.1.0"
description = "Build an agent-navigable, citation-verified knowledge base from sources you trust."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ugraph" }]
keywords = ["knowledge-base", "obsidian", "ai", "cli", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "python-frontmatter>=1.0.0",
  "tomli>=2.0.1; python_version < '3.11'",
  # Installs the `yt-dlp` executable used by both YouTube transcript ingestion
  # and deterministic person resolution. A fresh ugraph install must not need
  # a second, undocumented package-manager command before its core UX works.
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
api = [
  "anthropic>=0.34.0",
  "openai>=1.30.0",
]
dev = [
    "build>=1.2.2",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "twine>=6.0.0",
]

[project.scripts]
ugraph = "ugraph.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugraph*"]

[tool.setuptools.package-data]
ugraph = ["_bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
